
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign Up | Community Problem Platform</title>

    <link rel="icon" href="images/logo.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

<div class="auth-wrap">
    <div class="auth-card" style="max-width:560px">

        <div class="brand">
            <img src="images/logo.svg" alt="">
            <span>Community Problem Platform</span>
        </div>

        <h4 class="fw-bold mb-3">Create your citizen account</h4>

        <form id="regForm" novalidate>

            <div class="row g-3">

                <div class="col-12">
                    <label class="form-label">Full name</label>
                    <input
                        class="form-control"
                        name="full_name"
                        type="text"
                        minlength="2"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone number</label>
                    <input
                        type="tel"
                        class="form-control"
                        name="phone"
                        minlength="7"
                        maxlength="15"
                        placeholder="10-digit number"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label class="form-label">Confirm password</label>
                    <input
                        type="password"
                        class="form-control"
                        name="confirm_password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="col-12">
                    <label class="form-label">Location</label>
                    <input
                        class="form-control"
                        name="location"
                        maxlength="200"
                        placeholder="City / area"
                    >
                </div>

                <div class="col-12 d-grid">
                    <button
                        type="submit"
                        class="btn btn-green"
                        id="btn"
                    >
                        Create Account
                    </button>
                </div>

            </div>

        </form>

        <div class="text-center mt-3 small">
            Already registered?
            <a href="login.html" class="fw-semibold">Login</a>
        </div>

        <div class="text-center mt-2 small">
            <a href="index.html" class="muted">
                <i class="bi bi-arrow-left"></i> Back to home
            </a>
        </div>

    </div>
</div>

<script src="js/app.js"></script>
<script src="js/register.js"></script>

</body>
</html>
